<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background: linear-gradient(
          135deg,
          #f0f786,
          #ffe608
        ); /* Gradient background */
        text-align: center;
        color: #ffffff;
      }
      h1 {
        font-size: 28px;
        color: #333;
        margin-bottom: 20px;
      }
      .outer-square {
        width: 400px;
        height: 400px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 20px;
        background-color: #e0e0e0;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      }
      .button {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #007bff;
        color: white;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      }
      .button:hover {
        background-color: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>🎙️ Automatic Fact Checking</h1>
    <!-- Title with emoji -->
    <div class="outer-square">
      <button
        class="button"
        onclick="window.location.href='{% url 'analyze_audio' %}'"
      >
        Analyze Audio
      </button>
      <button
        class="button"
        onclick="window.location.href='{% url 'analyze_legal_query' %}'"
      >
        Analyze Legal Query
      </button>
      <button
        class="button"
        onclick="window.location.href='{% url 'ocr_view' %}'"
      >
        OCR
      </button>
      <button
        class="button"
        onclick="window.location.href='{% url 'chatbot_view' %}'"
      >
        Chatbot
      </button>
    </div>
  </body>
</html>
